<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointillism Lily — Canvas JavaScript</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08060c;color:#eee;font:16px system-ui;text-align:center}
main{max-width:760px;margin:auto;padding:16px}h1{font-size:1.3rem}canvas{width:min(100%,360px);height:auto;max-height:70vh;background:#04020a;border:1px solid #35243c}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}button{padding:9px 14px;border:1px solid #725879;border-radius:9px;background:#201526;color:white}
label{display:flex;gap:8px;align-items:center}.note{font-size:.85rem;color:#b9adbf}
</style></head>
<body><main><h1>Pointillism Lily</h1><p id="status">Preparando animación…</p>
<canvas id="view" width="720" height="1280"></canvas>
<div class="controls"><button id="pause">Pausar</button><button id="reset">Reiniciar</button><label>Velocidad <input id="speed" type="range" min=".25" max="2" step=".25" value="1"></label></div>
<p class="note">Versión JavaScript + Canvas. No necesita servidor Python ni dependencias externas.</p></main>
<script>
const W=720,H=1280,canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let t=0,last=0,paused=false,speed=1;
const rand=(()=>{let s=11;return()=>{s=(1664525*s+1013904223)>>>0;return s/4294967296}})();
const particles=[];
function add(x,y,color,r=1){particles.push({x,y,color,r})}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
// Static point-cloud composition, generated once for stable texture.
const ground=[];
for(let i=0;i<5000;i++){let dx=(rand()*2-1)*340;let mound=(1-(dx/340)**2)*55;ground.push({x:360+dx,y:1049-mound*Math.sqrt(rand())+(rand()-.5)*5,c:`rgb(${70+rand()*70|0},${55+rand()*45|0},${80+rand()*40|0})`})}
const dust=[];
for(let i=0;i<450;i++)dust.push({x:rand()*W,y:rand()*H,sp:6+rand()*16,ph:rand()*6.28,f:1+rand()*3});
const petalSeeds=[];
for(let k=0;k<6;k++)for(let i=0;i<2200;i++){
 let u=Math.pow(rand(),.85),v=rand()*2-1,profile=Math.pow(Math.sin(Math.PI*Math.pow(u,.7)),.9);
 let base=[205+50*Math.min(1,u/.35),40+155*u,125+103*u];
 if(Math.abs(v)<.07&&u<.55)base=[235,225,150];
 else if(rand()<.10&&u<.6&&Math.abs(v)<.75)base=[140,15,80];
 const shade=.82+.35*rand();
 petalSeeds.push({k,u,v,profile,base:base.map(a=>Math.min(255,a*shade)),outer:k%2===0});
}
const leafSeeds=[];
for(const [s0,L,side] of [[.10,190,1],[.24,175,-1],[.40,150,1],[.56,120,-1]]){
 for(let i=0;i<900;i++){let u=Math.pow(rand(),.9),v=rand()*2-1,prof=Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.8);
 leafSeeds.push({s0,L,side,u,v,prof,c:[40+100*u,160+75*u,100+40*u],mid:Math.abs(v)<.08})}
}
function dot(x,y,c,r=1){ctx.fillStyle=c;ctx.fillRect(x,y,r,r)}
function rgb(c,a=1){return `rgba(${Math.max(0,Math.min(255,c[0]))|0},${Math.max(0,Math.min(255,c[1]))|0},${Math.max(0,Math.min(255,c[2]))|0},${a})`}
function stemX(s,time){return 360+30*Math.sin(2.2*s)+10*Math.sin(.9*time)*s*s}
function stemY(s){return 1049-s*380}
function draw(time){
 ctx.fillStyle='rgb(4,2,10)';ctx.fillRect(0,0,W,H);
 // distant ground
 for(const p of ground)dot(p.x,p.y,p.c);
 // floating lights
 for(const d of dust){let y=(d.y-time*d.sp+H*10)%H,tw=.35+.65*(Math.sin(time*d.f+d.ph)>.2);dot(d.x,y,rgb([255*tw,200*tw,235*tw],.55),1.5)}
 const g=smooth(time/4),e=smooth((time-5)/10),rev=smooth((time-3.7)/1.6),hx=stemX(1,time),hy=stemY(1);
 // stem pointillism
 for(let i=0;i<3200;i++){let s=(i*0.61803398875)%1;if(s>g)continue;let dx=Math.sin(i*12.9898)*3.2*(1-.5*s);dot(stemX(s,time)+dx,stemY(s),rgb([40+80*s,150+65*s,95+25*s],.9),1.3)}
 // leaves
 for(const p of leafSeeds){let lg=Math.max(0,Math.min(1,(g-p.s0)*2.5));if(lg<=.01)continue;
  let u=p.u,L=p.L*lg,angle=.85+1.1*Math.pow(u,1.6),rr=L*u*Math.sin(angle),hh=L*u*Math.cos(angle);
  let wid=15*p.prof*lg,bx=stemX(p.s0,time),by=stemY(p.s0),sway=Math.sin(time*1.2+p.s0*5)*.03;
  let x=bx+p.side*(rr+p.v*wid*.35)+sway*hh*p.side,y=by-hh+p.v*wid;
  let c=p.mid?[190,240,170]:p.c;dot(x,y,rgb(c,.85),1.4)
 }
 // flower petals as point cloud
 if(rev>.01){
  const psi=.25+time*.22,cp=Math.cos(psi),sp=Math.sin(psi);
  for(const p of petalSeeds){if(p.u>rev)continue;
   const ph=p.k*Math.PI/3+.14,L=(p.outer?300:280)*(.45+.55*e)*(.35+.65*rev);
   const a0=(p.k%2===0?.10:.05),ao=(p.k%2===0?1.05:.82),curl=(.12+.88*e)*(p.k%2===0?.95:.75);
   const angle=a0+(ao-a0)*e+curl*Math.pow(p.u,1.6),rr=L*p.u*Math.sin(angle),hh=L*p.u*Math.cos(angle);
   const wid=(p.k%2===0?64:72)*(.55+.45*e)*p.profile*(.35+.65*rev);
   const X=rr*Math.cos(ph)-p.v*wid*Math.sin(ph),Z=rr*Math.sin(ph)+p.v*wid*Math.cos(ph),Y=hh+p.v*p.v*wid*(.30*(1-e)-.25*e);
   const Xp=X*cp+Z*sp,Zp=-X*sp+Z*cp,sy=Y*Math.cos(.5)-Zp*Math.sin(.5);
   let c=p.base.map((v,i)=>v*(.55+.45*Math.max(0,Math.min(1,Zp/300*.8+.5))));
   const tint=(1-e)*Math.min(1,p.u*1.3)*.6;c=c.map((v,i)=>v*(1-tint)+[135,205,125][i]*tint);
   dot(hx+Xp+Math.sin(time*.8)*.02*sy,hy-sy,rgb(c,.95),1.5);
  }
  // warm central stamens
  if(e>.28){for(let k=0;k<6;k++){let ph=k*Math.PI/3+.66;for(let j=0;j<80;j++){let u=j/80,L=215*(.4+.6*e)*smooth((e-.28)/.4),ang=.15+.55*e+.55*e*u;
    let rr=L*u*Math.sin(ang),hh=L*u*Math.cos(ang),x=hx+rr*Math.cos(ph),y=hy-hh*Math.cos(.5);
    dot(x,y,rgb([245,235,200]),1.6);if(j%2===0)dot(x+(rand()-.5)*10,y+(rand()-.5)*10,rgb([255,150,40]),2)
  }}}
 }
 // orbiting sparkle ring after bloom starts
 const ha=smooth((time-3.5)/4)*.9;
 if(ha>.01){for(let i=0;i<1100;i++){let a=i/1100*Math.PI*2+time*.12;dot(hx+300*Math.cos(a),hy-90+300*Math.sin(a),rgb([255,190,225],ha*.7),1.4)}}
 // glow overlay using low-res canvas compositing
}
const glow=document.createElement('canvas');glow.width=72;glow.height=128;const gctx=glow.getContext('2d');
function loop(now){requestAnimationFrame(loop);if(paused)return;if(now-last<30)return;last=now;draw(t);gctx.clearRect(0,0,72,128);gctx.drawImage(canvas,0,0,72,128);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.22;ctx.drawImage(glow,0,0,W,H);ctx.restore();t+=.03*speed;status.textContent=`Animación en marcha · ${t.toFixed(1)} s`}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Continuar':'Pausar'};
document.getElementById('reset').onclick=()=>{t=0};
document.getElementById('speed').oninput=e=>speed=Number(e.target.value);
status.textContent='Listo';requestAnimationFrame(loop);
</script></body></html>
