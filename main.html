
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi dibujo Python</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      max-width: 95%;
      background: #080810;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>Mi dibujo con Python</h1>
  <p id="estado">Cargando Python...</p>
  <canvas id="lienzo" width="800" height="600"></canvas>

  <script>
    async function iniciar() {
      try {
        const pyodide = await loadPyodide();
        await pyodide.loadPackage("numpy");

        const respuesta = await fetch("./dibujo.py");
        if (!respuesta.ok) {
          throw new Error("No se pudo cargar dibujo.py");
        }

        const codigo = await respuesta.text();
        await pyodide.runPythonAsync(codigo);

        document.getElementById("estado").textContent =
          "Dibujo cargado correctamente";
      } catch (error) {
        document.getElementById("estado").textContent =
          "Error: " + error.message;
        console.error(error);
      }
    }

    iniciar();
  </script>
</body>
</html>
